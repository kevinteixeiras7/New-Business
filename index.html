<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seventy7 New Business</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141414'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' fill='white' text-anchor='middle'%3E77%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0; --panel:#ffffff; --ink:#141414; --ink2:#3a3a3a; --muted:#7a7873; --line:#e6e3dc; --line2:#efede8;
  --accent:#141414; --hot:#c2410c; --hot-bg:#fdf0e9; --ok:#15803d; --ok-bg:#eaf6ee; --warn:#a16207; --warn-bg:#fdf6e3;
  --blue:#1d4ed8; --blue-bg:#ecf1fd; --r:10px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.nav button:focus-visible{outline-color:#fff}

/* shell */
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}
.side{background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:22px 14px}
.logo{font-weight:700;font-size:17px;letter-spacing:-.02em;padding:0 10px 4px}
.logo small{display:block;font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a8a6a0;margin-top:2px}
.nav{margin-top:26px;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:8px;color:#cfcdc7;font-weight:500}
.nav button:hover{background:#262626;color:#fff}
.nav button.on{background:#fff;color:var(--ink)}
.nav .count{font-size:11px;font-weight:600;background:var(--hot);color:#fff;border-radius:20px;padding:1px 7px}
.nav button.on .count{background:var(--hot)}
.xlink{margin-top:auto;display:block;padding:9px 10px;margin-bottom:8px;border:1px solid #333;border-radius:8px;color:#cfcdc7;text-decoration:none;font-weight:500;font-size:13px}
.xlink:hover{border-color:#666;color:#fff}
.mobile-only{display:none}
.pv{position:fixed;bottom:14px;right:14px;z-index:90;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:11px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}
.side .me{padding:10px;border-top:1px solid #2a2a2a;font-size:12px;color:#a8a6a0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .me b{color:#fff;font-weight:600;display:block;font-size:13px}
.side .me button{all:unset;cursor:pointer;text-decoration:underline;margin-top:6px;display:inline-block}
.main{overflow:auto;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:18px 28px 14px;border-bottom:1px solid var(--line)}
.top h1{font-size:22px;letter-spacing:-.02em;margin:0;flex:1}
.search{position:relative}
.search input{width:260px;padding:9px 12px 9px 32px;border:1px solid var(--line);border-radius:8px;background:#fff}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
.results{position:absolute;top:42px;right:0;width:340px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:30}
.results div{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line2)}
.results div:hover{background:var(--bg)}
.content{padding:24px 28px 60px}

/* elements */
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#cfcbc2}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.dark:hover{background:#333}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn.danger{color:var(--hot)}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.chip.hot{background:var(--hot-bg);color:var(--hot)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.dark{background:var(--ink);color:#fff}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line2)}
.panel-h h3{margin:0;font-size:14px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
input.f,select.f,textarea.f{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea.f{resize:vertical;min-height:70px}
label.l{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters select,.filters input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}

/* today */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{padding:16px 18px}
.stat .n{font-size:28px;font-weight:700;letter-spacing:-.03em}
.stat .t{color:var(--muted);font-size:12px;font-weight:500}
.stat.hot .n{color:var(--hot)}
.today{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.row .who{flex:1;min-width:0;cursor:pointer}
.row .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who span{font-size:12px;color:var(--muted)}
.row .acts{display:flex;gap:6px;flex-shrink:0}
.due{font-size:12px;font-weight:600;white-space:nowrap}
.due.over{color:var(--hot)}
.due.today{color:var(--warn)}
.group-label{padding:10px 16px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:#fbfaf8;border-bottom:1px solid var(--line2)}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(205px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:#ebe9e3;border-radius:var(--r);padding:8px;min-height:200px}
.col.drag{outline:2px dashed #999;outline-offset:-4px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 10px;font-weight:600;font-size:13px}
.col-h span{color:var(--muted);font-weight:500}
.bc{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:7px;cursor:grab;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.bc:hover{border-color:#cfcbc2}
.bc b{display:block;font-size:13px;margin-bottom:5px}
.bc .who{font-size:12px;color:var(--muted,#777);margin:-2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc .meta{display:flex;justify-content:space-between;align-items:center;gap:6px}
.bc.dragging{opacity:.4}
.col .more{text-align:center;padding:6px;font-size:12px;color:var(--muted)}

/* table */
table.t{width:100%;border-collapse:collapse;background:#fff}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:#fbfaf8;cursor:pointer;white-space:nowrap;position:sticky;top:0}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#fbfaf8}

/* radar */
.rhead{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.rhead>div{flex:1}
.rhead-t{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:2px}
.hot-t{color:var(--hot)}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;gap:2px;margin-bottom:16px}
.seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button b{font-weight:600;margin-left:4px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button.on b{color:var(--ink)}
.tchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.tchips button{all:unset;cursor:pointer;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600}
.tchips button b{font-weight:500;color:var(--muted);margin-left:3px}
.tchips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tchips button.on b{color:#bdbab3}
.tchips select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.rsec{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px}
.rsec h3{margin:0;font-size:15px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.rc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.rc-top{display:flex;align-items:center;gap:8px}
.rc-brand{font-size:17px;font-weight:700;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-head{font-size:13px;line-height:1.45;text-decoration:none;color:var(--ink2)}
.rc-head:hover{text-decoration:underline}
.rc-meta{font-size:12px;color:var(--muted)}
.rc-meta a{color:inherit}
.rc-warn{background:var(--hot-bg);color:#7c2d12;border-radius:8px;padding:8px 10px;font-size:12px}
.rc-dl{margin:4px 0 0;display:grid;grid-template-columns:1fr;gap:2px;font-size:13px;border-top:1px solid var(--line2);padding-top:10px}
.rc-dl dt{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.rc-dl dt:first-child{margin-top:0}
.rc-dl dd{margin:0;line-height:1.45}
.rc-li{font-size:12px;font-weight:600;color:var(--blue);white-space:nowrap}
.rc-more{font-size:12px;color:var(--muted)}
.rc-more summary{cursor:pointer;font-weight:600}
.rc-more a{display:block;margin-top:6px;color:var(--ink2);text-decoration:none}
.rc-more a:hover{text-decoration:underline}
.rc-act{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:6px}
.str{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.str i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.str i.on{background:var(--hot)}
.str i:last-of-type{margin-right:4px}
.str.mini{font-size:0;gap:3px;width:30px;flex-shrink:0}
.str.mini i:last-of-type{margin-right:0}
.rr{display:flex;align-items:center;gap:14px;padding:11px 16px;border-bottom:1px solid var(--line2)}
.rr:last-child{border-bottom:none}
.rr-main{flex:1;min-width:0}
.rr-head{display:block;font-size:12.5px;color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.rr-head:hover{text-decoration:underline;color:var(--ink2)}
.rr-when{white-space:nowrap}
.rr-act{display:flex;gap:4px}
.cl{display:grid;grid-template-columns:1fr 220px auto;gap:16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2)}
.cl:last-child{border-bottom:none}
.cl-main{min-width:0}
.cl-main a{text-decoration:none}
.cl-why{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.cl-who{display:flex;flex-direction:column;line-height:1.35}
.cl-who>span:first-child{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cl-act{display:flex;gap:6px;justify-content:flex-end}
@media (max-width:1100px){.rgrid{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.rgrid{grid-template-columns:1fr}.cl{grid-template-columns:1fr}.cl-act{justify-content:flex-start}.rr-when{display:none}.rhead{flex-wrap:wrap}}

.rm{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line2)}
.rm:last-child{border-bottom:none}
.rm-main{flex:1;min-width:0}
.rm-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rm-why{font-size:12.5px;color:var(--muted);margin-top:3px}
.rm-hot{font-size:11px;font-weight:700;color:var(--hot)}
.more-row{padding:10px 16px;text-align:center;border-top:1px solid var(--line2)}
.ai{color:#7c3aed;font-weight:700}
.ai-t{color:#7c3aed;font-weight:600}
.rc-act{flex-wrap:wrap}
.ai-w{color:#c4b5fd;margin-right:2px}
.nav .count.grey{background:#3a3a3a;color:#cfcdc7}
.nav button.on .count.grey{background:var(--line2);color:var(--ink)}
.fr{display:grid;grid-template-columns:1.1fr 1fr 1.3fr;gap:16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2)}
.fr:last-child{border-bottom:none}
.fr a{text-decoration:none}
.fr-w{display:flex;flex-direction:column;gap:1px;line-height:1.35}
.fr-w>span:first-child{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.fr-w a{color:var(--blue);margin-top:2px}
.fr-in{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fr-in .f{flex:1;min-width:150px;padding:7px 10px}
.fr2{display:grid;grid-template-columns:1fr 1.4fr auto;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line2)}
.fr2:last-child{border-bottom:none}
.fr2-b,.fr2-e{display:flex;flex-direction:column;line-height:1.35}
.fr2 a{text-decoration:none}
.fr2-a{display:flex;gap:6px}
.tool{display:flex;gap:16px;align-items:center}
.tool>div{flex:1}
.plist{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.plist>*{display:flex;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line2);font-size:13px}
.plist>*:last-child{border-bottom:none}
.plist span{color:var(--muted);flex:1}
.plist div b{flex:1}
@media (max-width:900px){.fr,.fr2{grid-template-columns:1fr}.tool{flex-direction:column;align-items:flex-start}
  .side{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent);scroll-behavior:smooth}}
/* dashboard */
.dash{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bar{height:8px;background:var(--line2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.funnel .fr{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;padding:7px 16px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,20,20,.28);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.12)}
.dh{padding:18px 22px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{margin:0;font-size:20px;letter-spacing:-.02em}
.dbody{flex:1;overflow:auto;padding:18px 22px 40px;display:flex;flex-direction:column;gap:16px}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.sec h4{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.contact{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line2)}
.contact:last-child{border-bottom:none}
.contact .ci{flex:1;min-width:0}
.contact .ci b{font-weight:600}
.contact .ci .small{overflow-wrap:anywhere}
.log{border-left:2px solid var(--line);padding-left:12px;margin-left:4px}
.log div{padding:5px 0 8px;position:relative}
.log div:before{content:"";position:absolute;left:-17px;top:10px;width:8px;height:8px;border-radius:50%;background:#c9c5bb}
.stagebar{display:flex;gap:4px;flex-wrap:wrap}
.stagebar button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer}
.stagebar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* modal + toast */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:60;background:rgba(20,20,20,.35)}
.modal .box{background:#fff;border-radius:12px;width:min(520px,92vw);padding:20px 22px;box-shadow:var(--shadow)}
.modal h3{margin:0 0 14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.clash{background:var(--hot-bg);border:1px solid #f3c9b3;color:#7c2d12;border-radius:var(--r);padding:12px 14px;font-size:13px}
.clash.soft{background:var(--blue-bg);border-color:#c9d6f7;color:#1e3a8a}
.clash a{color:inherit;font-weight:600}
.role{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--line2);color:var(--ink2)}
.role.Main{background:var(--ink);color:#fff}.role.Senior{background:var(--blue-bg);color:var(--blue)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ccard{padding:14px 16px;cursor:pointer}.ccard:hover{border-color:#cfcbc2}
.ccard h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccard .p{font-size:12px;color:var(--ink2);padding:2px 0;display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.reasons label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.hotrow b{font-weight:600}
.hot-dot{width:8px;height:8px;border-radius:50%;background:var(--hot);flex-shrink:0;box-shadow:0 0 0 4px var(--hot-bg)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;z-index:80;font-weight:500;box-shadow:var(--shadow)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--ink);color:#fff}
.login .box{text-align:center;max-width:380px;padding:30px}
.login h1{font-size:30px;letter-spacing:-.03em;margin:0 0 6px}
.login p{color:#a8a6a0;margin:0 0 26px}
.login .btn{padding:11px 18px;font-weight:600;color:var(--ink)}
.login .err{margin-top:18px;color:#fca5a5;font-size:13px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto}
  .side .nav{flex-direction:row;margin:0 0 0 14px}
  .side .nav button{white-space:nowrap;gap:6px}
  .side .me,.logo small,.xlink{display:none}
  .mobile-only{display:flex;flex-basis:100%;justify-content:flex-end}
  .today,.dash{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .top{flex-wrap:wrap;padding:14px 16px}
  .top h1{flex-basis:100%;font-size:19px}
  .search{flex:1}.search input{width:100%}
  .results{left:0;right:auto;width:100%}
  .content{padding:16px}
  .row{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="layer"></div>

<script type="module">
// ===================================================================
//  Seventy7 New Business
//  Firestore + Google sign-in. Config is read from Firebase Hosting's
//  reserved /__/firebase/init.json, so nothing needs pasting in.

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const addWorkdays = (s, n) => { const d = parseD(s); while (n > 0) { d.setDate(d.getDate()+1); if (d.getDay() % 6) n--; } return iso(d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const fmtD = s => s ? parseD(s).toLocaleDateString('en-GB', {day:'numeric', month:'short'}) : '';
const firstName = n => (n || '').trim().split(/\s+/)[0] || '';
const uid = () => Math.random().toString(36).slice(2, 10);
const slug = s => s.toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

function dueLabel(s){
  if (!s) return '<span class="due muted">No follow-up</span>';
  const n = daysBetween(today(), s);
  if (n < 0) return `<span class="due over">${-n}d overdue</span>`;
  if (n === 0) return '<span class="due today">Today</span>';
  if (n === 1) return '<span class="due">Tomorrow</span>';
  return `<span class="due muted">${fmtD(s)}</span>`;
}

async function firebaseStore(){
  const [{initializeApp}, A, F, Fn] = await Promise.all([
    import(FB+'firebase-app.js'), import(FB+'firebase-auth.js'),
    import(FB+'firebase-firestore.js'), import(FB+'firebase-functions.js')
  ]);
  const cfg = FIREBASE_CONFIG || await (await fetch('/__/firebase/init.json')).json();
  const app = initializeApp(cfg);
  const auth = A.getAuth(app);
  const db = F.getFirestore(app);
  const fns = Fn.getFunctions(app, 'europe-west2');
  const now = () => new Date().toISOString();
  let unsubs = [];

  return {
    onAuth(cb){ A.onAuthStateChanged(auth, cb); },
    async signIn(){
      const p = new A.GoogleAuthProvider(); p.setCustomParameters({hd: DOMAIN, prompt:'select_account'});
      await A.signInWithPopup(auth, p);
    },
    signOut(){ unsubs.forEach(u => u()); unsubs = []; return A.signOut(auth); },
    listen(onBrands, onSignals, onErr){
      unsubs.push(F.onSnapshot(F.collection(db,'brands'), snap => onBrands(snap.docs.map(d => ({id:d.id, ...d.data()}))), onErr));
      unsubs.push(F.onSnapshot(F.query(F.collection(db,'signals'), F.orderBy('createdAt','desc'), F.limit(200)),
        snap => onSignals(snap.docs.map(d => ({id:d.id, ...d.data()}))), onErr));
    },
    listenEngagement(onLinks, onClicks){
      unsubs.push(F.onSnapshot(F.query(F.collection(db,'links'), F.orderBy('createdAt','desc'), F.limit(400)),
        snap => onLinks(snap.docs.map(d => ({id:d.id, ...d.data()}))), e => console.warn('links', e.code)));
      unsubs.push(F.onSnapshot(F.query(F.collection(db,'clicks'), F.orderBy('at','desc'), F.limit(400)),
        snap => onClicks(snap.docs.map(d => { const x = d.data(); return {id:d.id, link:x.link, ua:x.ua || '', at: x.at && x.at.toDate ? x.at.toDate().toISOString() : new Date().toISOString()}; })),
        e => console.warn('clicks', e.code)));
    },
    listenClients(onClients){
      unsubs.push(F.onSnapshot(F.collection(db,'clients'), snap => onClients(snap.docs.map(d => ({id:d.id, ...d.data()}))), e => console.warn('clients', e.code)));
    },
    updateClient(id, patch){ return F.updateDoc(F.doc(db,'clients',id), {...patch, updatedAt: now()}); },
    async createClient(c){
      if ((await F.getDoc(F.doc(db,'clients',c.id))).exists()) c.id = c.id + '-' + uid().slice(0,4);
      const {id, ...rest} = c; await F.setDoc(F.doc(db,'clients',id), {...rest, createdAt: now(), updatedAt: now()}); return id;
    },
    removeClient(id){ return F.deleteDoc(F.doc(db,'clients',id)); },
    async importClients(list, overwrite){
      const existing = new Set(S.clients.map(c => c.id));
      let written = 0, skipped = 0; const batch = F.writeBatch(db);
      list.forEach(({id, ...rest}) => { if (existing.has(id) && !overwrite){ skipped++; return; } batch.set(F.doc(db,'clients',id), {...rest, createdAt: now(), updatedAt: now()}); written++; });
      if (written) await batch.commit();
      return {written, skipped};
    },
    async createLinks(list){
      const batch = F.writeBatch(db);
      list.forEach(({id, ...r}) => batch.set(F.doc(db,'links',id), r));
      await batch.commit();
    },
    async markSent(ids){
      const batch = F.writeBatch(db);
      ids.forEach(id => batch.update(F.doc(db,'links',id), {sent:true, sentAt: now()}));
      await batch.commit();
    },
    async update(id, patch, entry){
      const data = {...patch, updatedAt: now()};
      if (entry) data.log = F.arrayUnion(entry);
      await F.updateDoc(F.doc(db,'brands',id), data);
    },
    async create(b){
      const ref = F.doc(db,'brands', b.id);
      const ex = await F.getDoc(ref);
      if (ex.exists()) b.id = b.id + '-' + uid().slice(0,4);
      await F.setDoc(F.doc(db,'brands',b.id), {...b, createdAt: now(), updatedAt: now()});
      return b.id;
    },
    remove(id){ return F.deleteDoc(F.doc(db,'brands',id)); },
    updateSignal(id, patch){ return F.updateDoc(F.doc(db,'signals',id), patch); },
    async importBrands(list, overwrite){
      const existing = new Set(S.brands.map(b => b.id));
      let written = 0, skipped = 0, batch = F.writeBatch(db), n = 0;
      for (const b of list){
        if (existing.has(b.id) && !overwrite){ skipped++; continue; }
        const {id, ...rest} = b;
        batch.set(F.doc(db,'brands',id), {...rest, createdAt: now(), updatedAt: now()});
        written++; n++;
        if (n === 400){ await batch.commit(); batch = F.writeBatch(db); n = 0; }
      }
      if (n) await batch.commit();
      return {written, skipped};
    },
    async getRadar(){ const d = await F.getDoc(F.doc(db,'settings','radar')); return d.exists() ? d.data() : null; },
    saveRadar(data){ return F.setDoc(F.doc(db,'settings','radar'), {queries: data.queries, updatedAt: now()}, {merge:true}); },
    async runScan(){ const r = await Fn.httpsCallable(fns,'runScanNow',{timeout:300000})(); return r.data; },
    async findContact(name, website){ const r = await Fn.httpsCallable(fns,'findContact',{timeout:120000})({name, website}); return r.data; }
  };
}

  let ob, os, ol, oc;
  const emit = () => { ob && ob(brands.map(b => ({...b}))); os && os(signals.map(s => ({...s}))); ol && ol(links.map(l => ({...l}))); oc && oc(clicks.map(c => ({...c}))); };

    onAuth(cb){ setTimeout(() => cb({displayName:'Kevin Teixeira', email:'kevin.teixeira@seventy7group.com'}), 0); },

    listenClients(a){ ocl = a; ocl(clients.map(c => ({...c}))); },
    async updateClient(id, patch){ clients = clients.map(c => c.id === id ? {...c, ...patch} : c); ocl(clients.map(c => ({...c}))); },
    async createClient(c){ clients.push(c); ocl(clients.map(c => ({...c}))); return c.id; },
    async removeClient(id){ clients = clients.filter(c => c.id !== id); ocl(clients.map(c => ({...c}))); },
    async importClients(list){ return {written:0, skipped:list.length}; },
    async createLinks(list){ links = [...list, ...links]; emit(); },
    async markSent(ids){ links = links.map(l => ids.includes(l.id) ? {...l, sent:true} : l); emit(); },
    async update(id, patch, entry){ brands = brands.map(b => b.id === id ? {...b, ...patch, log: entry ? [...(b.log||[]), entry] : b.log} : b); emit(); },
    async create(b){ if (brands.some(x => x.id === b.id)) b.id += '-' + uid().slice(0,4); brands.push(b); emit(); return b.id; },
    async remove(id){ brands = brands.filter(b => b.id !== id); emit(); },
    async updateSignal(id, patch){ signals = signals.map(s => s.id === id ? {...s, ...patch} : s); emit(); },
    async importBrands(list){ return {written:0, skipped:list.length}; },
    async getRadar(){ return null; }, async saveRadar(){},
    async runScan(){ await new Promise(r => setTimeout(r, 900)); return {added:0, scanned:0}; },
    async findContact(name){ await new Promise(r => setTimeout(r, 500)); const d = name.toLowerCase().replace(/[^a-z0-9]/g,'') + '.com'; return Math.random() < .6 ? {website:'https://'+d, email:'press@'+d, kind:'Press inbox', source:'https://'+d+'/contact'} : {website:'https://'+d, email:'', note:'No published email on the site'}; }
  };
}

async function setStage(id, stage){
  const b = byId(id); if (!b || b.stage === stage) return;
  const patch = {stage, nextFollowUp: nextForStage(stage)};
  if (stage === 'Won' || stage === 'Lost'){
    const reasons = stage === 'Won' ? WON_REASONS : LOST_REASONS;
    modal(`<h3>${stage === 'Won' ? 'Nice one. Why did we win' : 'Why did we lose'} ${esc(b.name)}?</h3>
      <label class="l">Main reason</label>
      <div class="reasons">${reasons.map((r, i) => `<label><input type="radio" name="m-reason" value="${esc(r)}" ${i === 0 ? 'checked' : ''}> ${esc(r)}</label>`).join('')}</div>
      <label class="l" style="margin-top:12px">Anything to add? (optional)</label><input class="f" id="m-note" placeholder="${stage === 'Won' ? 'e.g. loved the Beauty deck, test shoot sealed it' : 'e.g. went with a cheaper studio in Manchester'}">`,
      async () => {
        const reason = document.querySelector('input[name="m-reason"]:checked')?.value || 'Other';
        const note = $('#m-note').value.trim();
        patch.outcome = {result: stage, reason, note, date: today(), by: me()};
        await store.update(id, patch, entry('Stage', `${b.stage} → ${stage}: ${reason}${note ? ' (' + note + ')' : ''}`));
        toast(`${b.name} marked ${stage}`);
      }, `Mark ${stage}`);
    return;
  }
  await store.update(id, patch, entry('Stage', `${b.stage} → ${stage}`));
  toast(`${b.name} moved to ${stage}`);
}

async function logTouch(id, type, text, nextDate){
  const b = byId(id); if (!b) return;
  const patch = {};
  if (type !== 'Note'){
    patch.lastContact = today();
    let stage = b.stage;
    if (stage === 'Prospect'){ stage = 'Contacted'; patch.stage = stage; }
    patch.nextFollowUp = nextDate || nextForStage(stage) || null;
  } else if (nextDate) patch.nextFollowUp = nextDate;
  await store.update(id, patch, entry(type, text || `${type} logged`));
  toast('Logged');
}

async function quickChased(id){
  const b = byId(id);
  await logTouch(id, 'Email', 'Follow-up sent');
}
async function snooze(id, days){
  const b = byId(id);
  const d = days === 7 ? addDays(today(), 7) : addWorkdays(today(), days);
  await store.update(id, {nextFollowUp: d}, entry('Snooze', `Follow-up moved to ${fmtD(d)}`));
  toast(`Snoozed to ${fmtD(d)}`);
}

  if (!sg || !sg.date || daysBetween(sg.date, today()) > 45) return '';
  return (HOOKS[sg.type] || HOOKS.News)(b);

function buildEmail(C){
  const b = byId(C.brandId), c = (b.contacts || [])[C.ci] || {};
  const deck = C.deck ? deckByKey(C.deck) : null;
  const n = firstName(c.name) || 'there';
  const hook = hookFor(b);
  const main = (MAIN_TEXT[b.stage] || MAIN_TEXT.Contacted)(b, deck);
  let body = `Hi ${n},\n\n` + (hook ? hook + '\n\n' : '') + main;
  C.tokens = {deck: deck ? '[here]' : '', reel: C.reel ? '[showreel]' : ''};
  if (deck) body += `\n\nTake a look at our ${deck.name} ${C.tokens.deck} for a flavour of our work.`;
  if (C.reel) body += `\n\nYou can also watch our ${C.tokens.reel}.`;
  return {subject: (SUBJECTS[b.stage] || SUBJECTS.Contacted)(b), body: body + '\n\n', contact: c, deck};
}

function stageAfterSend(b, C){
  if (C.deck && ['Prospect','Contacted'].includes(b.stage)) return 'Portfolio Sent';
  if (b.stage === 'Prospect') return 'Contacted';
  return b.stage;
}
async function composeAction(act){
  const C = S.compose; if (!C) return;
  const b = byId(C.brandId);
  if (act === 'cancel'){ S.compose = null; renderCompose(); return; }
  if (C.step === 1){
    if (['copy','mailapp','owa'].includes(act) && clientMatch(b)?.current && !$('#cp-ok')?.checked){ toast(`${b.name} is a current client. Tick the box once you've checked with the account lead.`); return; }
    C.subject = $('#cp-subject').value; C.body = $('#cp-body').value;
  }
  const c = b.contacts[C.ci];
  if (['copy','mailapp','owa'].includes(act)){
    // Clipboard and new-tab must happen straight from the click, before anything is awaited
    const plain = richBody(C).text;
    const firstLink = C.tokens.deck && C.body.includes(C.tokens.deck) ? GO_BASE + C.ids.deck : C.tokens.reel && C.body.includes(C.tokens.reel) ? GO_BASE + C.ids.reel : '';
    if (act === 'copy'){ const ok = await copyRich(C); if (!ok) toast('The browser blocked copying'); }
    else if (firstLink){ try { await navigator.clipboard.writeText(firstLink); C.copiedLink = firstLink === GO_BASE + C.ids.deck ? 'deck' : 'reel'; } catch {} }
    if (act === 'owa') window.open(`https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(c.email)}&subject=${encodeURIComponent(C.subject)}&body=${encodeURIComponent(plain)}`, '_blank', 'noopener');
    if (act === 'mailapp') location.href = `mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(C.subject)}&body=${encodeURIComponent(plain)}`;
    await saveLinks(C, b, c);
    C.via = act; C.step = 2; setTimeout(renderCompose, act === 'mailapp' ? 300 : 0); return;
  }
  if (act === 'copy-deck' || act === 'copy-reel'){
    try { await navigator.clipboard.writeText(GO_BASE + (act === 'copy-deck' ? C.ids.deck : C.ids.reel)); C.copiedLink = act === 'copy-deck' ? 'deck' : 'reel'; renderCompose(); toast('Link copied'); }
    catch { toast('The browser blocked copying'); }
    return;
  }
  if (act === 'notsent'){ S.compose = null; renderCompose(); return; }
  if (act === 'sent'){
    const after = stageAfterSend(b, C);
    const next = $('#cp-next').value || null;
    if (C.saved?.length) await store.markSent(C.saved);
    const what = [C.deck && C.tokens.deck && C.body.includes(C.tokens.deck) ? deckByKey(C.deck).name : '', C.reel && C.body.includes(C.tokens.reel) ? 'showreel' : ''].filter(Boolean).join(' + ');
    const patch = {lastContact: today(), nextFollowUp: next};
    if (after !== b.stage) patch.stage = after;
    if (C.deck && C.deck !== suggestedDeck(b)) patch.deck = C.deck;
    await store.update(b.id, patch, {...entry('Email', `Emailed ${c.name || c.email}${what ? ': ' + what : ''}`), links: C.saved || []});
    S.compose = null; renderCompose(); toast('Logged');
  }
}
// The message as rich text: [Beauty portfolio] becomes a link that reads "Beauty portfolio"
function richBody(C){
  const links = [];
  if (C.tokens.deck) links.push([C.tokens.deck, GO_BASE + C.ids.deck]);
  if (C.tokens.reel) links.push([C.tokens.reel, GO_BASE + C.ids.reel]);
  let html = esc(C.body), text = C.body;
  links.forEach(([tok, url]) => {
    const label = tok.slice(1, -1);
    html = html.split(esc(tok)).join(`<a href="${url}">${esc(label)}</a>`);
    text = text.split(tok).join(label);
  });
  html = html.replace(/\n/g, '<br>');
  return {html: `<div style="font-family:Aptos,Calibri,Arial,sans-serif;font-size:11pt;color:#000">${html}</div>`, text};
}
async function copyRich(C){
  const {html, text} = richBody(C);
  try {
    await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html], {type: 'text/html'}), 'text/plain': new Blob([text], {type: 'text/plain'})})]);
    return true;
  } catch (e){
    try { // fallback: copy a selected rich element
      const d = document.createElement('div'); d.innerHTML = html; d.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(d); const r = document.createRange(); r.selectNodeContents(d);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      const ok = document.execCommand('copy'); sel.removeAllRanges(); d.remove(); return ok;
    } catch { return false; }
  }
}
async function saveLinks(C, b, c){
  if (C.saved) return;
  const base = {brandId: b.id, brand: b.name, contact: c.name || c.email, sector: b.sector, stage: b.stage, sent: false, createdBy: me(), createdAt: new Date().toISOString()};
  const list = [];
  if (C.deck && C.tokens.deck && C.body.includes(C.tokens.deck)){ const d = deckByKey(C.deck); list.push({id: C.ids.deck, ...base, deck: d.key, deckName: d.name, url: DRIVE_URL(d.id)}); }
  if (C.reel && C.tokens.reel && C.body.includes(C.tokens.reel)) list.push({id: C.ids.reel, ...base, deck: 'showreel', deckName: 'Showreel', url: DRIVE_URL(SHOWREEL.id)});
  if (list.length){ try { await store.createLinks(list); } catch (err){ console.warn(err); toast('Links not tracked: ' + (err.code || err.message)); } }
  C.saved = list.map(l => l.id);
}

// ---------- client directory + clash check ----------
const GENERIC_DOMAINS = new Set(['gmail.com','googlemail.com','outlook.com','hotmail.com','hotmail.co.uk','live.com','me.com','mac.com','icloud.com','yahoo.com','yahoo.co.uk','aol.com']);
const normName = n => (n || '').toLowerCase().replace(/[&+]/g, ' and ').replace(/\b(the|ltd|limited|london|uk|co|company|group|inc)\b/g, ' ').replace(/[^a-z0-9]/g, '');
const domainOf = e => (e || '').split('@')[1]?.toLowerCase() || '';
let clashCache = {key: '', map: new Map()};
function clientIndex(){
  const key = S.clients.length + '|' + S.clients.map(c => c.updatedAt || '').join('').length;
  if (clashCache.key === key) return clashCache;
  const names = new Map(), domains = new Map(), emails = new Map();
  S.clients.forEach(c => {
    if (normName(c.name)) names.set(normName(c.name), c);
    (c.contacts || []).forEach(p => {
      if (!p.email) return;
      emails.set(p.email.toLowerCase(), {c, p});
      const d = domainOf(p.email); if (d && !GENERIC_DOMAINS.has(d) && !domains.has(d)) domains.set(d, c);
    });
  });
  return clashCache = {key, names, domains, emails};
}
// Is this pipeline brand already a client? Returns {client, why, current} or null.
function clientMatch(b){
  if (!b || !S.clients.length) return null;
  const I = clientIndex();
  const byName = I.names.get(normName(b.name));
  if (byName) return {client: byName, why: 'same name', current: byName.status !== 'Lapsed'};
  for (const p of (b.contacts || [])){
    const e = I.emails.get((p.email || '').toLowerCase());
    if (e) return {client: e.c, why: `${p.name || p.email} is a contact at ${e.c.name}`, current: e.c.status !== 'Lapsed'};
    const d = I.domains.get(domainOf(p.email));
    if (d) return {client: d, why: `${domainOf(p.email)} email, same as ${d.name}`, current: d.status !== 'Lapsed'};
  }
  return null;
}
const clashChip = b => { const m = clientMatch(b); return !m ? '' : m.current ? '<span class="chip hot" title="Already a client">Client</span>' : '<span class="chip blue" title="Former client">Former client</span>'; };
function clashBanner(b){
  const m = clientMatch(b); if (!m) return '';
  const main = (m.client.contacts || []).find(p => p.role === 'Main');
  return m.current
    ? `<div class="clash"><b>${esc(m.client.name)} is a current client.</b> Matched on ${esc(m.why)}. Check with the account lead before any outreach${main ? ` (main contact: ${esc(main.name || main.email)})` : ''}. <a href="#" data-open-client="${m.client.id}">Open client</a></div>`
    : `<div class="clash soft"><b>Former client:</b> ${esc(m.client.name)} (${esc(m.why)}). A warm win-back rather than a cold intro. <a href="#" data-open-client="${m.client.id}">Open client</a></div>`;
}

function ago(isoStr){
  const m = Math.round((Date.now() - Date.parse(isoStr)) / 60000);
  if (m < 60) return `${Math.max(1, m)}m ago`;
  const h = Math.round(m / 60); if (h < 24) return `${h}h ago`;
  return `${Math.round(h / 24)}d ago`;
}

const cleanTitle = t => (t || '').replace(/\s+[-–|]\s+[^-–|]{2,40}$/, '');

  const types = Object.keys(typeCounts).sort((a, b) => typeCounts[b] - typeCounts[a]);
  const filters = `<div class="tchips">
    <button class="${!f.sigType?'on':''}" data-act="rtype" data-v="">All <b>${scopeGroups.length}</b></button>
    ${types.map(t => `<button class="${f.sigType===t?'on':''}" data-act="rtype" data-v="${esc(t)}">${esc(t)} <b>${typeCounts[t]}</b></button>`).join('')}
    <span style="flex:1"></span>
    <select data-f="sector"><option value="">All sectors</option>${SECTORS.map(s => `<option ${f.sector===s?'selected':''}>${s}</option>`).join('')}</select>
  </div>`;
  if (!groups.length) return head + filters + `<div class="card"><div class="empty">${fresh.length ? 'Nothing matches these filters.' : 'You\'re all caught up. New stories arrive every morning at 7am.'}</div></div>`;

  const picks = groups.filter(g => !clientInTitle(g[0].title)).slice(0, 3);
  const rest = groups.filter(g => !picks.includes(g));
  const limit = S.radarMore || 25;
  return head + filters + `
    <div class="rsec"><h3>Top picks</h3><span class="small muted">The strongest reasons to get in touch right now</span></div>
    <div class="rgrid">${picks.map(g => radarCard(g, true)).join('')}</div>
    ${rest.length ? `<div class="rsec"><h3>Everything else</h3><span class="small muted">${rest.length} more ${rest.length === 1 ? 'brand' : 'brands'}, strongest first. Click a headline to read the story.</span></div>
    <div class="card">${rest.slice(0, limit).map(radarRow).join('')}</div>
    ${rest.length > limit ? `<div style="text-align:center;margin-top:12px"><button class="btn" data-act="rmore">Show ${Math.min(25, rest.length - limit)} more</button></div>` : ''}` : ''}`;
}

function guessBrand(title){
  let t = title.replace(/\s+[-–|]\s+[^-–|]+$/, '');            // drop " - Source"
  t = t.split(/\s+(appoints?|appointed|names?|hires?|raises?|launch(es)?|opens?|unveils?|secures?|rebrands?|relaunch(es)?|expands?|enters|debuts?|announces?|taps|signs|partners|is|has|to)\b/i)[0];
  t = t.replace(/^.*?\b(brand|label|retailer|start-?up|company|maker|chain|designer)\s+/i, '');
  t = t.replace(/['’]s$/, '').trim();
  if (/^(\w+\s)?(brand|label|retailer|start-?up|company|chain)$/i.test(t)) return '';
  return t.split(/\s+/).length <= 5 ? t : '';
}

const isWeekend = d => [0, 6].includes(parseD(d).getDay());
function spreadPlan(cap){
  const t = today();
  const live = S.brands.filter(b => b.nextFollowUp && !['Won','Lost','Paused'].includes(b.stage))
    .sort((a, b) => a.nextFollowUp.localeCompare(b.nextFollowUp) || (PRANK[a.priority] ?? 1) - (PRANK[b.priority] ?? 1));
  const per = {}, moves = [], orig = {};
  live.forEach(b => { const d = b.nextFollowUp < t ? t : b.nextFollowUp; orig[d] = (orig[d] || 0) + 1; });
  for (const b of live){
    let d = b.nextFollowUp < t ? t : b.nextFollowUp;
    while (isWeekend(d) || (per[d] || 0) >= cap) d = addDays(d, 1);
    per[d] = (per[d] || 0) + 1;
    if (d !== b.nextFollowUp && !(b.nextFollowUp < t && d === t)) moves.push({b, from: b.nextFollowUp, to: d});
  }
  const top = Object.entries(orig).sort((a, b) => b[1] - a[1])[0] || [t, 0];
  return {moves, busiest: {d: top[0], n: top[1]}};
}

const KEEP = new Set(['ASICS','AYBL','ELF','FC','AFC','FRKL','LNDR','MAC','NARS','REFY','JW','UK','USA','NYX','DKNY','ASOS','CDLP']);
const SPECIAL = {'LOREAL':"L'Oréal", 'MCLAREN':'McLaren', 'NOBODYS CHILD':"Nobody's Child", 'NEILS YARD':"Neal's Yard", 'SIMMI LODNON':'Simmi London', 'JESSICA MCKORMACK':'Jessica McCormack', '4TH & RECKLESS':'4th & Reckless'};
const SMALL = new Set(['AND','OF','THE','DI','DE','DA','LA','X','BY','IN','ON']);
function tidyName(n){
  if (n !== n.toUpperCase() || !/[A-Z]/.test(n)) return n;
  if (SPECIAL[n]) return SPECIAL[n];
  return n.split(/\s+/).map((w, i) => {
    if (KEEP.has(w) || /[+&]/.test(w) && w.length > 1 || /\d/.test(w) && !/^\d+(ST|ND|RD|TH)$/.test(w)) return w;
    if (i > 0 && SMALL.has(w)) return w.toLowerCase();
    return w.toLowerCase().replace(/(^|[-'’])([a-zà-ÿ])/g, (m, a, c) => a + c.toUpperCase()).replace(/^Mc([a-z])/, (m, c) => 'Mc' + c.toUpperCase());
  }).join(' ');
}

// ---------- Dashboard ----------
function linkStatsCard(){
  const sent = S.links.filter(l => l.sent);
  const openedIds = new Set(opens().map(o => o.link));
  const row = (label, L) => { const o = L.filter(l => openedIds.has(l.id)).length; const pct = L.length ? Math.round(o / L.length * 100) : 0;
    return `<div class="fr"><span>${esc(label)}</span><div class="bar"><i style="width:${pct}%"></i></div><b>${pct}%</b></div>`; };
  const group = key => [...new Set(sent.map(l => l[key]))].map(k => [k, sent.filter(l => l[key] === k)]).sort((a, b) => b[1].length - a[1].length);
  return `<div class="card"><div class="panel-h"><h3>Portfolio open rate</h3><span class="small muted">${sent.length} sent · ${sent.filter(l => openedIds.has(l.id)).length} opened</span></div>
    <div class="funnel" style="padding:8px 0">${sent.length ? row('All links', sent) + group('deckName').map(([k, L]) => row(k, L)).join('') : '<div class="empty">Send a portfolio from the Email button to start tracking.</div>'}</div>
    ${sent.length ? `<div class="panel-h" style="border-top:1px solid var(--line2)"><h3>By sector</h3></div><div class="funnel" style="padding:8px 0">${group('sector').map(([k, L]) => row(k, L)).join('')}</div>` : ''}
  </div>`;
}
function outcomeCard(){
  const done = S.brands.filter(b => b.outcome);
  const count = res => { const m = {}; done.filter(b => b.outcome.result === res).forEach(b => m[b.outcome.reason] = (m[b.outcome.reason] || 0) + 1); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const list = (res, cls) => { const c = count(res); return c.length ? c.map(([r, n]) => `<div class="row" style="padding:8px 16px"><span style="flex:1">${esc(r)}</span><span class="chip ${cls}">${n}</span></div>`).join('') : '<div class="empty" style="padding:14px">None yet</div>'; };
  return `<div class="card"><div class="panel-h"><h3>Why we win and lose</h3></div>
    <div class="group-label">Won</div>${list('Won', 'ok')}<div class="group-label">Lost</div>${list('Lost', 'hot')}</div>`;
}

function vDash(){
  const B = S.brands;
  const cnt = st => B.filter(b => b.stage === st).length;
  const reached = B.filter(b => b.stage !== 'Prospect').length;
  const funnel = [['Brands tracked', B.length], ['Contacted', reached], ['Portfolio sent', B.filter(b => ['Portfolio Sent','Meeting','Proposal','Won'].includes(b.stage)).length],
    ['Meeting', B.filter(b => ['Meeting','Proposal','Won'].includes(b.stage)).length], ['Proposal', B.filter(b => ['Proposal','Won'].includes(b.stage)).length], ['Won', cnt('Won')]];
  const max = Math.max(1, B.length);
  const since = addDays(today(), -30);
  const touches = {};
  B.forEach(b => (b.log||[]).forEach(l => { if (l.by && l.by !== 'Imported' && l.date >= since && !['Snooze','Stage'].includes(l.type)) touches[l.by] = (touches[l.by]||0) + 1; }));
  const tmax = Math.max(1, ...Object.values(touches));
  const live = B.filter(b => ACTIVE.includes(b.stage));
  const withDate = live.filter(b => b.nextFollowUp).length, over = live.filter(b => b.nextFollowUp && b.nextFollowUp < today()).length;
  const noContact = B.filter(b => !(b.contacts||[]).some(c => c.email)).length;
  const flags = B.reduce((n, b) => n + (b.contacts||[]).filter(c => c.flag).length, 0);
  const sigAdded = S.signals.filter(s => s.status === 'added').length;

  return `<div class="dash">
    <div class="card"><div class="panel-h"><h3>Funnel</h3></div><div class="funnel" style="padding:8px 0">
      ${funnel.map(([l,n]) => `<div class="fr"><span>${l}</span><div class="bar"><i style="width:${n/max*100}%"></i></div><b>${n}</b></div>`).join('')}
    </div></div>
    <div class="card"><div class="panel-h"><h3>Pipeline health</h3></div><div style="padding:6px 16px 14px">
      <div class="row" style="padding:10px 0"><span style="flex:1">Active deals with a follow-up date</span><b>${withDate}/${live.length}</b></div>
      <div class="row" style="padding:10px 0"><span style="flex:1">Overdue follow-ups</span><b style="color:${over?'var(--hot)':'inherit'}">${over}</b></div>
      <div class="row" style="padding:10px 0"><span style="flex:1">Brands with no email contact yet</span><b>${noContact}</b></div>
      <div class="row" style="padding:10px 0"><span style="flex:1">Contact details flagged to check</span><b>${flags}</b></div>
      <div class="row" style="padding:10px 0"><span style="flex:1">Radar signals added to pipeline</span><b>${sigAdded}</b></div>
    </div></div>
    <div class="card" style="grid-column:1/-1;overflow:auto"><div class="panel-h"><h3>By sector</h3></div>
      <table class="t"><thead><tr><th>Sector</th>${['Brands',...BOARD,'Paused'].map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>
      ${SECTORS.map(sec => { const L = B.filter(b => b.sector === sec); return L.length ? `<tr><td><b>${sec}</b></td><td>${L.length}</td>${[...BOARD,'Paused'].map(st => { const n = L.filter(b => b.stage === st).length; return `<td>${n || '<span class="muted">·</span>'}</td>`; }).join('')}</tr>` : ''; }).join('')}
      </tbody></table></div>
    <div class="card"><div class="panel-h"><h3>Touchpoints logged, last 30 days</h3></div><div class="funnel" style="padding:8px 0">
      ${Object.keys(touches).length ? Object.entries(touches).sort((a,b) => b[1]-a[1]).map(([p,n]) => `<div class="fr"><span>${esc(p)}</span><div class="bar"><i style="width:${n/tmax*100}%"></i></div><b>${n}</b></div>`).join('') : '<div class="empty">Nothing logged in the app yet.</div>'}
    </div></div>
    <div class="card"><div class="panel-h"><h3>Biggest opportunities</h3></div>
      ${B.filter(b => ['Meeting','Proposal'].includes(b.stage)).map(b => `<div class="row"><div class="who" data-open="${b.id}"><b>${esc(b.name)}</b><span>${esc([b.budget, b.opportunity, b.shootType].filter(Boolean).join(' · ') || b.sector)}</span></div>${stageChip(b.stage)}</div>`).join('') || '<div class="empty">No meetings or proposals yet.</div>'}
    </div>
    ${linkStatsCard()}
    ${outcomeCard()}
  </div>`;
}

async function clientAction(act, t){
  const c = S.clients.find(x => x.id === S.openClient);
  if (act === 'new'){
    modal(`<h3>Add a client</h3><label class="l">Client name</label><input class="f" id="m-name">`, async () => {
      const name = $('#m-name').value.trim(); if (!name) return false;
      if (S.clients.some(x => normName(x.name) === normName(name))){ toast(`${name} is already in the directory`); return false; }
      const id = await store.createClient({id: slug(name), name, status: 'Current', contacts: [], notes: ''});
      setTimeout(() => { S.openClient = id; S.editingCC = 'new'; renderDrawer(); }, 200);
    }, 'Add client');
    return;
  }
  if (!c) return;
  if (act === 'copy'){ try { await navigator.clipboard.writeText(t.dataset.v); toast('Email copied'); } catch { toast(t.dataset.v); } return; }
  if (act === 'save-contact'){
    const email = $('#cc-email').value.trim().toLowerCase();
    if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('That email doesn\'t look right'); return; }
    const p = {name: $('#cc-name').value.trim(), role: $('#cc-role').value, email, phone: $('#cc-phone').value.trim(), note: $('#cc-note').value.trim()};
    if (!p.name && !p.email){ toast('Add a name or email'); return; }
    const contacts = [...(c.contacts || [])];
    if (S.editingCC === 'new') contacts.push(p); else contacts[S.editingCC] = p;
    S.editingCC = null; await store.updateClient(c.id, {contacts}); return;
  }
  if (act === 'del-contact'){
    const p = c.contacts[S.editingCC]; if (!confirm(`Remove ${p.name || p.email}?`)) return;
    const contacts = c.contacts.filter((_, i) => i !== S.editingCC); S.editingCC = null;
    await store.updateClient(c.id, {contacts}); return;
  }
  if (act === 'delete'){
    if (!confirm(`Delete ${c.name} and its contacts from the client directory? This can't be undone.`)) return;
    await store.removeClient(c.id); closeDrawer(); toast('Deleted'); return;
  }
  if (act === 'winback'){
    const id = await store.create({...newBrand({name: c.name, sector: 'Other', priority: 'High', nextFollowUp: today(),
      notes: `Win-back: former client.${c.notes ? '\n' + c.notes : ''}`, log: [entry('Note', 'Added from the client directory as a win-back')]}),
      contacts: (c.contacts || []).map(p => ({name: p.name || '', title: p.role === 'Main' ? 'Main contact (as client)' : p.note || '', email: p.email || '', phone: p.phone || '', linkedin: '', flag: ''}))});
    toast(`${c.name} added to the pipeline`); setTimeout(() => openBrand(id), 200);
  }
}

        </div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
          <span class="small muted">Next follow-up</span><input type="date" class="f" id="t-next" style="width:auto" value="${nextForStage(b.stage === 'Prospect' ? 'Contacted' : b.stage) || ''}">
          <span style="flex:1"></span><button class="btn dark" data-act="log">Log it</button>
        </div>
      </div>

      <div class="sec"><h4 style="display:flex;justify-content:space-between">Contacts <button class="btn sm" data-act="add-contact">+ Add</button></h4>
        ${contacts.map((c, i) => ec === i ? contactForm(c) : `<div class="contact">
          <div class="ci"><b>${esc(c.name || (c.ai ? c.title || 'Inbox' : 'Unnamed'))}</b>${aiMark(c)} <span class="muted small">${c.name || !c.ai ? esc(c.title) : ''}</span>
            ${c.flag ? `<div><span class="chip warn">${esc(c.flag)}</span></div>` : ''}
            <div class="small">${c.email ? esc(c.email) : '<span class="muted">No email</span>'}${c.phone ? ' · ' + esc(c.phone) : ''}${c.linkedin ? ` · <a href="${esc(c.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>` : ''}</div></div>
          <div style="display:flex;gap:4px">${c.email ? `<button class="btn sm" data-compose="${b.id}" data-ci="${i}">Email</button>` : ''}<button class="btn sm ghost" data-edit-contact="${i}">Edit</button></div>
        </div>`).join('')}
        ${ec === 'new' ? contactForm({}) : ''}
        ${!contacts.length && ec !== 'new' ? '<div class="muted small">No contacts yet. Find the Head of Ecommerce, Creative Producer or Brand Marketing lead on LinkedIn.</div>' : ''}
      </div>

      <div class="sec"><h4>Details</h4>
        <div class="grid2">
          <div><label class="l">Name</label><input class="f" data-bf="name" value="${esc(b.name)}"></div>
          <div><label class="l">Website</label><input class="f" data-bf="website" value="${esc(b.website)}" placeholder="https://"></div>
          <div><label class="l">Sector</label><select class="f" data-bf="sector">${SECTORS.map(s => `<option ${b.sector===s?'selected':''}>${s}</option>`).join('')}</select></div>
          <div><label class="l">Priority</label><select class="f" data-bf="priority">${PRIORITIES.map(s => `<option ${b.priority===s?'selected':''}>${s}</option>`).join('')}</select></div>
          <div><label class="l">Budget / volume</label><input class="f" data-bf="budget" value="${esc(b.budget)}" placeholder="e.g. 5 shoots a year"></div>
          <div><label class="l">Opportunity</label><input class="f" data-bf="opportunity" value="${esc(b.opportunity)}" placeholder="e.g. Full service"></div>
          <div><label class="l">Shoot type</label><input class="f" data-bf="shootType" value="${esc(b.shootType)}" placeholder="e.g. Model and ecomm"></div>
          <div><label class="l">Campaign type</label><input class="f" data-bf="campaignType" value="${esc(b.campaignType)}"></div>
        </div>
        <div style="margin-top:12px"><label class="l">Notes</label><textarea class="f" data-bf="notes" rows="4">${esc(b.notes)}</textarea></div>
      </div>

      <div class="sec"><h4>History</h4>
        ${log.length ? `<div class="log">${log.map(l => `<div><b class="small">${esc(l.type)}</b> <span class="small muted">${fmtD(l.date)} · ${esc(l.by||'')}</span><div>${esc(l.text)}</div></div>`).join('')}</div>` : '<div class="muted small">No history yet.</div>'}
      </div>
      <div style="text-align:right"><button class="btn sm ghost danger" data-act="delete-brand">Delete brand</button></div>
    </div>
  </div>`;
  L.querySelector('.dbody').scrollTop = keepScroll;
}

function contactForm(c){
  return `<div class="contact" style="display:block;background:#fbfaf8;margin:6px -8px;padding:12px 8px;border-radius:8px">
    <div class="grid2">
      <div><label class="l">Name</label><input class="f" id="c-name" value="${esc(c.name)}"></div>
      <div><label class="l">Job title</label><input class="f" id="c-title" value="${esc(c.title)}"></div>
      <div><label class="l">Email</label><input class="f" id="c-email" value="${esc(c.email)}"></div>
      <div><label class="l">Phone</label><input class="f" id="c-phone" value="${esc(c.phone)}"></div>
      <div style="grid-column:1/-1"><label class="l">LinkedIn</label><input class="f" id="c-linkedin" value="${esc(c.linkedin)}"></div>
    </div>
    ${c.flag ? `<label class="small" style="display:block;margin-top:8px"><input type="checkbox" id="c-clearflag"> Details checked, clear "${esc(c.flag)}"</label>` : ''}
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn sm dark" data-act="save-contact">Save</button><button class="btn sm" data-act="cancel-contact">Cancel</button>
      <span style="flex:1"></span>${S.editingContact !== 'new' ? '<button class="btn sm ghost danger" data-act="del-contact">Remove</button>' : ''}
    </div></div>`;
}

async function saveContact(){
  const b = byId(S.open); const contacts = [...(b.contacts||[])];
  const i = S.editingContact;
  const prev = i === 'new' ? {} : contacts[i];
  const email = $('#c-email').value.trim().toLowerCase();
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('That email doesn\'t look right'); return; }
  const c = {name: $('#c-name').value.trim(), title: $('#c-title').value.trim(), email, phone: $('#c-phone').value.trim(),
    linkedin: $('#c-linkedin').value.trim(), flag: $('#c-clearflag')?.checked ? '' : (email !== prev.email ? '' : prev.flag || '')};
  if (!c.name && !c.email){ toast('Add a name or email'); return; }
  if (i === 'new') contacts.push(c); else contacts[i] = c;
  S.editingContact = null;
  await store.update(b.id, {contacts}, i === 'new' ? entry('Note', `Added contact ${c.name || c.email}`) : null);
}

// ===================================================================
//  Modal
// ===================================================================
function modal(html, onOk, okLabel = 'Save'){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box">${html}<div class="acts"><button class="btn" data-m="x">Cancel</button><button class="btn dark" data-m="ok">${okLabel}</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('input,select')?.focus();
  m.addEventListener('click', async e => {
    if (e.target === m || e.target.dataset.m === 'x') m.remove();
    if (e.target.dataset.m === 'ok'){ e.target.disabled = true; const r = await onOk(); if (r === false) e.target.disabled = false; else m.remove(); }
  });
}

// ===================================================================
//  Events
// ===================================================================
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-nav],[data-act],[data-open],[data-chased],[data-snooze],[data-stage],[data-sort],[data-sig-add],[data-sig-dismiss],[data-sig-email],[data-sig-undo],[data-sig-li],[data-edit-contact],[data-compose],[data-cp],[data-open-client],[data-ce],[data-cc-edit]');
  if (!t) { if (!e.target.closest('.search')) $('#gres')?.classList.add('hidden'); return; }
  const d = t.dataset;
  try {
    if (d.nav){ S.view = d.nav; if (d.nav === 'admin' && !S.radar) S.radar = await store.getRadar() || {}; render(); $('.main').scrollTop = 0; if (innerWidth <= 900) $('.nav button.on')?.scrollIntoView({inline:'center', block:'nearest'}); return; }
    if (d.open){ $('#gres')?.classList.add('hidden'); return openBrand(d.open); }
    if (d.chased) return quickChased(d.chased);
    if (d.snooze) return snooze(d.snooze, Number(d.days));
    if (d.stage) return setStage(S.open, d.stage);
    if (d.sort){ S.f.dir = S.f.sort === d.sort ? -S.f.dir : 1; S.f.sort = d.sort; return render(); }
    if (d.sigAdd) return sigAdd(d.sigAdd, d.group ? d.group.split(',') : null);
    if (d.sigDismiss){ await markSigs(d.group ? d.group.split(',') : [d.sigDismiss], {status:'dismissed'}); return; }
    if (d.sigEmail) return sigEmail(d.sigEmail, d.group ? d.group.split(',') : null);
    if (d.sigLi) return sigLinkedIn(d.sigLi, d.group ? d.group.split(',') : null);
    if (d.sigUndo){ await store.updateSignal(d.sigUndo, {status:'new', handledBy: me(), handledAt: new Date().toISOString()}); return; }
    if (d.editContact !== undefined){ S.editingContact = Number(d.editContact); return renderDrawer(); }
    if (d.openClient){ e.preventDefault(); $('#gres')?.classList.add('hidden'); S.open = null; S.openClient = d.openClient; S.editingCC = null; return renderDrawer(); }
    if (d.ccEdit !== undefined){ S.editingCC = d.ccEdit === 'new' ? 'new' : Number(d.ccEdit) < 0 ? null : Number(d.ccEdit); return renderDrawer(); }
    if (d.ce) return clientAction(d.ce, t);
    if (d.compose){ return openCompose(d.compose, d.ci != null ? Number(d.ci) : null); }
    if (d.cp) return composeAction(d.cp);
    switch (d.act){
      case 'signin':
        try { await store.signIn(); } catch (err){
          if (err.code === 'auth/popup-blocked') renderLogin('Your browser blocked the Google sign-in window. Allow pop-ups for this site, then click Sign in again.');
          else if (!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(err.code)) renderLogin(err.message);
        }
        break;
      case 'signout': store.signOut(); break;
      case 'toggle-week': S.showWeek = !S.showWeek; render(); break;
      case 'spread': spreadReview(); break;
      case 'tidy': tidyReview(); break;
      case 'find-one': await findOne(d.id); break;
      case 'find-all': findAll(); break;
      case 'find-stop': if (S.finding) S.finding.stop = true; break;
      case 'fe-save': await saveFoundEmail(d.id); break;
      case 'ai-ok': await aiConfirm(d.id, Number(d.ci), true); break;
      case 'ai-no': await aiConfirm(d.id, Number(d.ci), false); break;
      case 'rtab': S.radarTab = d.v; render(); $('.main').scrollTop = 0; break;
      case 'rtype': S.f.sigType = d.v; S.radarMore = 0; render(); break;
      case 'rmore': S.radarMore = (S.radarMore || 25) + 25; render(); break;
      case 'close': closeDrawer(); break;
      case 'clear-f': Object.assign(S.f, {q:'', sector:'', stage:'', prio:''}); render(); break;
      case 'toggle-paused': S.f.showPaused = t.checked; render(); break;
      case 'add-contact': S.editingContact = 'new'; renderDrawer(); setTimeout(() => $('#c-name')?.focus(), 0); break;
      case 'cancel-contact': S.editingContact = null; renderDrawer(); break;
      case 'save-contact': await saveContact(); break;
      case 'del-contact': {
        const b = byId(S.open); const c = b.contacts[S.editingContact];
        if (!confirm(`Remove ${c.name || c.email}?`)) break;
        const contacts = b.contacts.filter((_, i) => i !== S.editingContact); S.editingContact = null;
        await store.update(b.id, {contacts}, entry('Note', `Removed contact ${c.name || c.email}`)); break;
      }
      case 'log': {
        const txt = $('#t-text').value.trim(), type = $('#t-type').value;
        if (!txt && type === 'Note'){ toast('Write a note first'); break; }
        await logTouch(S.open, type, txt, $('#t-next').value || null); break;
      }
      case 'delete-brand': {
        const b = byId(S.open);
        if (!confirm(`Delete ${b.name} and all its contacts and history? This can't be undone.`)) break;
        await store.remove(b.id); closeDrawer(); toast('Deleted'); break;
      }
      case 'new-brand':
        modal(`<h3>Add a brand</h3>
          <label class="l">Brand name</label><input class="f" id="m-name">
          <div class="grid2" style="margin-top:12px">
            <div><label class="l">Sector</label><select class="f" id="m-sector">${SECTORS.map(x => `<option>${x}</option>`).join('')}</select></div>
            <div><label class="l">Priority</label><select class="f" id="m-prio">${PRIORITIES.map(x => `<option ${x==='Medium'?'selected':''}>${x}</option>`).join('')}</select></div>
          </div>`, async () => {
            const name = $('#m-name').value.trim(); if (!name) return false;
            const dup = S.brands.find(b => b.name.toLowerCase() === name.toLowerCase());
            const cl = clientMatch({name, contacts: []});
            if (cl?.current && !confirm(`${cl.client.name} is already a current client. Add it to the new business pipeline anyway?`)) return false;
            if (dup){ toast(`${dup.name} is already in the app`); openBrand(dup.id); return; }
            const id = await store.create(newBrand({name, sector: $('#m-sector').value, priority: $('#m-prio').value, log:[entry('Note','Brand added')]}));
            setTimeout(() => openBrand(id), 200);
          }, 'Add brand');
        break;
      case 'scan':
        S.scanning = true; render();
        try { const r = await store.runScan(); toast(`Scan done: ${r.added} new signal${r.added===1?'':'s'}`); }
        catch (err){ toast(/not-found|internal|unavailable/.test(err.code || '') ? "The radar isn't switched on yet. It needs the Firebase Blaze plan and a one-off deploy." : 'Scan failed: ' + (err.message || err)); }
        S.scanning = false; render(); break;
      case 'import': {
        const file = $('#seedfile').files[0]; if (!file){ toast('Choose seed.json first'); break; }
        const data = JSON.parse(await file.text());
        const list = data.brands || (Array.isArray(data) ? data : []), cl = data.clients || [];
        if (!list.length && !cl.length){ toast('Nothing to import in that file'); break; }
        if (!confirm(`Import ${[list.length ? list.length + ' brands' : '', cl.length ? cl.length + ' clients' : ''].filter(Boolean).join(' and ')}?`)) break;
        t.disabled = true; t.textContent = 'Importing…';
        const over = $('#seedover').checked, msgs = [];
        if (list.length){ const r = await store.importBrands(list, over); msgs.push(`${r.written} brands imported, ${r.skipped} skipped`); }
        if (cl.length){ const r = await store.importClients(cl, over); msgs.push(`${r.written} clients imported, ${r.skipped} skipped`); }
        toast(msgs.join('; ')); t.disabled = false; t.textContent = 'Import'; break;
      }
      case 'export': exportCsv(); break;
      case 'save-radar': {
        const queries = $('#radarq').value.split('\n').map(s => s.trim()).filter(Boolean);
        S.radar = {...(S.radar||{}), queries}; await store.saveRadar(S.radar); toast('Saved'); break;
      }
    }
  } catch (err){ console.error(err); toast('Something went wrong: ' + (err.code || err.message)); }
});

document.addEventListener('change', async e => {
  const t = e.target;
  if (['cp-to','cp-deck','cp-reel'].includes(t.id) && S.compose){
    const C = S.compose;
    if (t.id === 'cp-to') C.ci = Number(t.value);
    if (t.id === 'cp-deck') C.deck = t.value;
    if (t.id === 'cp-reel') C.reel = t.checked;
    const em = buildEmail(C); C.subject = em.subject; C.body = em.body;
    renderCompose(); return;
  }
  if (t.dataset.f){ S.f[t.dataset.f] = t.value; render(); return; }
  if (t.dataset.cf && S.openClient){
    const c = S.clients.find(x => x.id === S.openClient); const k = t.dataset.cf; let v = t.value;
    if (k === 'name'){ v = v.trim(); if (!v) return; }
    if ((c[k] || '') !== v) await store.updateClient(c.id, {[k]: v});
    return;
  }
  if (t.dataset.bf && S.open){
    const b = byId(S.open); const k = t.dataset.bf; let v = t.value;
    if (k === 'name'){ v = v.trim(); if (!v) return render(); }
    if ((b[k] || '') === v) return;
    await store.update(b.id, {[k]: v || (k === 'nextFollowUp' ? null : '')}, k === 'nextFollowUp' ? entry('Snooze', v ? `Follow-up set to ${fmtD(v)}` : 'Follow-up cleared') : null);
  }
});

let qTimer;
document.addEventListener('input', e => {
  if (e.target.id === 'fq'){ clearTimeout(qTimer); qTimer = setTimeout(() => { S.f.q = e.target.value; render(); const i = $('#fq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); }
  if (e.target.id === 'gsearch'){
    const q = e.target.value.trim().toLowerCase(), box = $('#gres');
    if (q.length < 2){ box.classList.add('hidden'); return; }
    const hits = [];
    S.brands.forEach(b => {
      if (b.name.toLowerCase().includes(q)) hits.push(`<div data-open="${b.id}"><b>${esc(b.name)}</b> <span class="small muted">${esc(b.stage)} · ${esc(b.sector)}</span></div>`);
      (b.contacts||[]).forEach(c => { if ((c.name + ' ' + c.email).toLowerCase().includes(q)) hits.push(`<div data-open="${b.id}">${esc(c.name)} <span class="small muted">${esc(c.title)} at ${esc(b.name)}</span></div>`); });
    });
    S.clients.forEach(c => {
      if (c.name.toLowerCase().includes(q)) hits.push(`<div data-open-client="${c.id}"><b>${esc(c.name)}</b> <span class="small muted">Client</span></div>`);
      (c.contacts||[]).forEach(p => { if (((p.name||'') + ' ' + (p.email||'')).toLowerCase().includes(q)) hits.push(`<div data-open-client="${c.id}">${esc(p.name || p.email)} <span class="small muted">${esc(p.role)} contact at ${esc(c.name)} (client)</span></div>`); });
    });
    box.innerHTML = hits.slice(0, 14).join('') || '<div class="muted">No matches</div>';
    box.classList.remove('hidden');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (document.querySelector('.modal')){ document.querySelector('.modal').remove(); S.compose = null; } else if (S.open || S.openClient) closeDrawer(); }
  if (e.key === 'Enter' && e.target.id === 't-text'){ document.querySelector('[data-act="log"]')?.click(); }
});

function exportCsv(){
  const head = ['Brand','Sector','Stage','Priority','Last contact','Next follow-up','Contact','Job title','Email','Phone','LinkedIn','Flag','Budget','Opportunity','Shoot type','Notes'];
  const rows = [head];
  [...S.brands].sort((a,b) => a.name.localeCompare(b.name)).forEach(b => {
    const base = [b.name, b.sector, b.stage, b.priority, b.lastContact||'', b.nextFollowUp||''];
    const tail = [b.budget, b.opportunity, b.shootType, b.notes];
    const cs = (b.contacts||[]).length ? b.contacts : [{}];
    cs.forEach(c => rows.push([...base, c.name||'', c.title||'', c.email||'', c.phone||'', c.linkedin||'', c.flag||'', ...tail]));
  });
  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type:'text/csv'}));
  a.download = `seventy7-new-business-${today()}.csv`; a.click();
}

// ===================================================================
//  Boot
// ===================================================================
(async () => {
  const onFirebaseHosting = /\.(web\.app|firebaseapp\.com)$/.test(location.hostname);
  S.preview = !FIREBASE_CONFIG && !onFirebaseHosting;
  try { store = S.preview ? await demoStore() : await firebaseStore(); }
  catch (err){ $('#root').innerHTML = `<div class="login"><div class="box"><h1>Seventy7</h1><p>Couldn't connect to Firebase. Check FIREBASE_CONFIG at the top of index.html.</p></div></div>`; return; }
  if (S.preview){ window.confirm = () => true; document.body.insertAdjacentHTML('beforeend', '<div class="pv">Preview · sample data · changes are not saved</div>'); }
  let renderQueued = false;
  const rerender = () => { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false;
    const a = document.activeElement;
    const typing = a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !['checkbox','file','radio'].includes(a.type)));
    if (typing){ a.addEventListener('blur', () => setTimeout(rerender, 50), {once:true}); return; }
    render(); }); };
  store.onAuth(user => {
    if (!user){ S.user = null; return renderLogin(); }
    if (!user.email?.toLowerCase().endsWith('@' + DOMAIN)){ store.signOut(); return renderLogin(`Use your @${DOMAIN} account.`); }
    S.user = user; S.isAdmin = ADMINS.includes(user.email.toLowerCase());
    $('#root').innerHTML = '<div class="login"><div class="box"><p>Loading…</p></div></div>';
    store.listen(
      brands => { S.brands = brands; rerender(); },
      signals => { S.signals = signals; rerender(); },
      err => { if (err.code === 'permission-denied'){ store.signOut(); renderLogin("Your account doesn't have access yet. Ask Kevin to add you."); } }
    );
    store.listenEngagement(l => { S.links = l; rerender(); }, c => { S.clicks = c; rerender(); });
    store.listenClients(c => { S.clients = c; clashCache.key = ''; rerender(); });
  });
})();
</script>
